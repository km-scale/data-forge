[pytest]
# Doctests only: every public function documents itself with a runnable example.
# Recipes run their doctests in their own pixi environment (scripts/recipe_tasks.py).
testpaths = scripts
pythonpath = scripts
addopts =
    --doctest-modules
    --import-mode=importlib
    --strict-markers
    --strict-config
    -p no:cacheprovider
# No ELLIPSIS: examples must show exact output.
doctest_optionflags = NORMALIZE_WHITESPACE
xfail_strict = true
filterwarnings =
    error
    # zarr warns about its own experimental features, not about our code
    ignore::zarr.errors.ZarrUserWarning
