# Lint, strict typing, doctests, recipe checks and the docs build.
# On main, the built site is deployed to GitHub Pages.

name: "Data forge: CI"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "recipes/**"
              - "scripts/**"
              - "docs/**"
              - "mkdocs.yml"
              - "pixi.toml"
              - "pixi.lock"
              - "mypy.ini"
              - "pytest.ini"
              - "ruff.toml"
              - ".github/workflows/ci.yml"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: dev docs
          cache: true
          # runs `pixi install --locked` because pixi.lock is committed

      - run: pixi run -e dev lint
      - run: pixi run -e dev typecheck
      - run: pixi run -e dev doctest
      - run: pixi run doctest-coverage

      - name: Recipes
        run: |
          # PRs: only recipes they touch, unless shared code changed. main: all recipes.
          paths=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if ! grep -qE '^(scripts/|pixi\.(toml|lock)$|mypy\.ini$|pytest\.ini$)' <<<"$changed"; then
              paths=$(grep '^recipes/' <<<"$changed" | tr '\n' ' ' || true)
              if [ -z "$paths" ]; then echo "no recipes changed"; exit 0; fi
            fi
          fi
          pixi run python scripts/check_recipes.py $paths
          pixi run python scripts/recipe_tasks.py --locked $paths

      - name: Build site
        run: pixi run docs

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
